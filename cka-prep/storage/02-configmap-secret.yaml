# CKA Practice: ConfigMap and Secret

# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  config.properties: |
    log.level=INFO
    cache.ttl=300

---
# Secret (base64 encoded values)
# echo -n 'mypassword' | base64  →  bXlwYXNzd29yZA==
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
data:
  db-password: bXlwYXNzd29yZA==
  secret-key: c3VwZXJzZWNyZXQ=

---
# Pod consuming both
apiVersion: v1
kind: Pod
metadata:
  name: app-pod
spec:
  containers:
    - name: app
      image: nginx
      # Env vars from ConfigMap
      envFrom:
        - configMapRef:
            name: app-config
      env:
        # Single key from Secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: db-password
      volumeMounts:
        # Mount ConfigMap as a file
        - name: config-volume
          mountPath: /etc/config
  volumes:
    - name: config-volume
      configMap:
        name: app-config

# Imperative commands:
# kubectl create configmap app-config --from-literal=APP_ENV=prod --from-file=config.properties
# kubectl create secret generic app-secret --from-literal=db-password=mypassword

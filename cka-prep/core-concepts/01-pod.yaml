# CKA Practice: Pod with various configurations
# Generate base: kubectl run mypod --image=nginx --dry-run=client -o yaml

apiVersion: v1
kind: Pod
metadata:
  name: mypod
  namespace: default
  labels:
    app: mypod
    env: dev
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
      env:
        - name: APP_ENV
          value: "production"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: secret-key
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 3
  restartPolicy: Always
  # nodeSelector:
  #   disktype: ssd
